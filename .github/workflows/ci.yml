name: CI

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
        python-version: ["3.9", "3.11", "3.12"]
        exclude:
          # Python 3.11 is exercised by the release-identical locked-runtime
          # jobs below; floating dependencies must never gate/build releases.
          - os: windows-latest
            python-version: "3.11"
          - os: macos-15
            python-version: "3.11"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --disable-pip-version-check . pytest
      - name: Test
        run: python -m pytest -q
      - name: Compile entry points
        run: python -m compileall -q chatlog_keeper tests

  macos-release-runtime:
    runs-on: macos-15
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up exact release Python and SQLite
        uses: conda-incubator/setup-miniconda@835234971496cad1653abb28a638a281cf32541f # v3.2.0
        with:
          miniconda-version: "py311_26.5.3-2"
          activate-environment: chatlog-release-macos
          environment-file: packaging/macos-release-environment.yml
          auto-activate-base: false
          channels: defaults
          channel-priority: strict
      - name: Verify exact runtime
        run: python -c "import os, platform, sqlite3, sys; assert sys.version_info[:3] == (3, 11, 15); assert sqlite3.sqlite_version == '3.53.2'; assert sys.prefix == os.environ['CONDA_PREFIX']; assert os.environ.get('CONDA_DEFAULT_ENV') == 'chatlog-release-macos'; assert platform.machine() == 'arm64'"
      - name: Install the release-locked dependency graph
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r packaging/release-requirements-macos.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation .
          python -m pip check
      - name: Test
        run: python -m pytest -q
      - name: Compile entry points
        run: python -m compileall -q chatlog_keeper tests

  windows-release-runtime:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up exact release Python and SQLite
        uses: conda-incubator/setup-miniconda@835234971496cad1653abb28a638a281cf32541f # v3.2.0
        with:
          miniconda-version: "py311_26.5.3-2"
          activate-environment: chatlog-release-windows
          environment-file: packaging/windows-release-environment.yml
          auto-activate-base: false
          channels: defaults
          channel-priority: strict
      - name: Verify exact runtime and shifted pending-byte gate
        shell: pwsh
        run: |
          python -c "import os, platform, sqlite3, sys; assert sys.version_info[:3] == (3, 11, 15); assert sqlite3.sqlite_version == '3.53.2'; assert sys.prefix == os.environ['CONDA_PREFIX']; assert os.environ.get('CONDA_DEFAULT_ENV') == 'chatlog-release-windows'; assert platform.machine().lower() in {'amd64', 'x86_64'}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I chatlog_keeper/_qq_sqlite_helper.py --runtime-probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r packaging/release-requirements-windows.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test
        shell: pwsh
        run: python -m pytest -q
      - name: Compile entry points
        shell: pwsh
        run: python -m compileall -q chatlog_keeper tests
